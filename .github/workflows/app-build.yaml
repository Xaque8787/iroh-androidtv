name: App / Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version-file: .tools-versions
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Fetch pinned Iroh SDK
        run: bash scripts/fetch-iroh-sdk.sh
      - name: Assemble debug APKs
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug
      - name: Create publish bundle
        run: mkdir -p build/gh-app-publish/; find app/build/ -iname "*.apk" -exec mv "{}" build/gh-app-publish/ \;
      - name: Record beta build identity
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          {
            echo "Iroh Jellyfin TV beta"
            echo "Source commit: $SOURCE_SHA"
            echo "Source ref: $SOURCE_REF"
            echo "Application ID: io.github.xaque8787.iroh.androidtv.debug"
            echo "Iroh SDK: 0.4.0"
            sha256sum build/gh-app-publish/*.apk
          } > build/gh-app-publish/BUILD-INFO.txt
          cat build/gh-app-publish/BUILD-INFO.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iroh-androidtv-debug-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: build/gh-app-publish/
