name: App / Build

on:
  workflow_dispatch:
    inputs:
      kausway_sdk_version:
        description: Kausway client SDK version (latest stable, or an exact version such as 0.5.0)
        type: string
        default: latest

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version-file: .tools-versions
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Test SDK release selection
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Resolve and verify Kausway SDK
        id: sdk
        env:
          GH_TOKEN: ${{ github.token }}
          KAUSWAY_SDK_VERSION: ${{ inputs.kausway_sdk_version }}
        run: bash scripts/fetch-kausway-sdk.sh
      - name: Assemble debug APKs
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug
      - name: Create publish bundle
        run: mkdir -p build/gh-app-publish/; find app/build/ -iname "*.apk" -exec mv "{}" build/gh-app-publish/ \;
      - name: Record beta build identity
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          SDK_TAG: ${{ steps.sdk.outputs.release_tag }}
          SDK_ARTIFACT: ${{ steps.sdk.outputs.artifact }}
        run: |
          {
            echo "Iroh Jellyfin TV beta"
            echo "Source commit: $SOURCE_SHA"
            echo "Source ref: $SOURCE_REF"
            echo "Application ID: io.github.xaque8787.iroh.androidtv.debug"
            echo "Kausway SDK: Xaque8787/Kausway $SDK_TAG"
            sha256sum "$SDK_ARTIFACT"
            sha256sum build/gh-app-publish/*.apk
          } > build/gh-app-publish/BUILD-INFO.txt
          cp app/libs/kausway-sdk.properties build/gh-app-publish/KAUSWAY-SDK.properties
          cat build/gh-app-publish/BUILD-INFO.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iroh-androidtv-debug-${{ github.sha }}-sdk${{ steps.sdk.outputs.version }}-run${{ github.run_id }}-attempt${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: build/gh-app-publish/
